<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拍掣報日期 - 特殊教育互動教學系統</title>
    <!-- Tailwind CSS for Responsive Layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Accessible Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@700;900&display=swap');
        
        * {
            font-family: 'Noto Sans HK', system-ui, -apple-system, sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        /* High Contrast SEN Visual Themes */
        body.theme-yellow-on-black { background-color: #000000; color: #FFFF00; }
        body.theme-yellow-on-black .card-bg { background-color: #111111; border-color: #FFFF00; }
        body.theme-yellow-on-black .btn-accent { background-color: #FFFF00; color: #000000; }

        body.theme-black-on-yellow { background-color: #FFDE00; color: #000000; }
        body.theme-black-on-yellow .card-bg { background-color: #FFF275; border-color: #000000; }
        body.theme-black-on-yellow .btn-accent { background-color: #000000; color: #FFDE00; }

        body.theme-yellow-on-blue { background-color: #031B33; color: #FFE600; }
        body.theme-yellow-on-blue .card-bg { background-color: #0A294A; border-color: #FFE600; }
        body.theme-yellow-on-blue .btn-accent { background-color: #FFE600; color: #031B33; }

        body.theme-playful { background-color: #0f172a; color: #f8fafc; }
        body.theme-playful .card-bg { background-color: rgba(30, 41, 59, 0.85); border-color: #38bdf8; }
        body.theme-playful .btn-accent { background-color: #f59e0b; color: #0f172a; }

        /* 3D Giant Switch Button */
        .big-switch-btn {
            transition: transform 0.08s ease-out, box-shadow 0.08s ease-out;
            box-shadow: 0 22px 0 #990000, 0 30px 35px rgba(0,0,0,0.8);
        }
        .big-switch-btn:active, .big-switch-btn.active {
            transform: translateY(16px);
            box-shadow: 0 6px 0 #990000, 0 12px 20px rgba(0,0,0,0.6);
        }

        /* Pulse Highlight for Switch Attention */
        @keyframes switch-pulse {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(239, 68, 68, 0.7)); }
            50% { filter: drop-shadow(0 0 40px rgba(239, 68, 68, 1)); }
        }
        .pulse-glow {
            animation: switch-pulse 2.2s infinite;
        }

        /* Wave / Ripple Effect on Switch Press */
        .ripple-ring {
            position: absolute;
            border-radius: 50%;
            border: 10px solid rgba(255, 235, 59, 0.9);
            animation: ripple-anim 0.7s cubic-bezier(0, 0.2, 0.8, 1) forwards;
            pointer-events: none;
        }
        @keyframes ripple-anim {
            0% { width: 0px; height: 0px; opacity: 1; }
            100% { width: 600px; height: 600px; opacity: 0; }
        }

        /* Confetti Burst Particle */
        .confetti-particle {
            position: fixed;
            width: 16px;
            height: 16px;
            pointer-events: none;
            z-index: 100;
            animation: fall-rotate 2.2s ease-out forwards;
        }
        @keyframes fall-rotate {
            0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(80vh) rotate(720deg) scale(0.5); opacity: 0; }
        }
    </style>
</head>
<body class="theme-yellow-on-black min-h-screen flex flex-col justify-between overflow-x-hidden relative transition-colors duration-300">

    <header class="p-4 border-b-4 border-current flex justify-between items-center bg-black/40 backdrop-blur z-20">
        <div class="flex items-center space-x-3">
            <span class="text-4xl sm:text-5xl" aria-hidden="true">🔴</span>
            <div>
                <h1 id="app-title" class="text-2xl sm:text-3xl font-black tracking-wide">拍掣報日期</h1>
                <p class="text-xs sm:text-sm opacity-90 font-bold">特殊教育輔具 · 因果關係與日期認知訓練</p>
            </div>
        </div>

        <!-- Right Tools: Star Counter & Teacher Panel Button -->
        <div class="flex items-center space-x-3 sm:space-x-4">
            <!-- Star Reward Counter -->
            <div class="flex items-center card-bg px-4 py-2 rounded-2xl border-2 font-black text-xl sm:text-2xl shadow-lg">
                <i class="fa-solid fa-star text-amber-400 mr-2 text-2xl sm:text-3xl animate-bounce"></i>
                <span id="star-count" class="min-w-[30px] text-center">0</span>
            </div>

            <!-- Teacher Control Panel Toggle Button -->
            <button onclick="toggleTeacherPanel()" class="btn-accent px-4 py-2 rounded-2xl border-2 border-current font-black text-base sm:text-lg flex items-center space-x-2 focus:outline-none focus:ring-4 focus:ring-amber-300 active:scale-95 transition">
                <i class="fa-solid fa-gear text-xl"></i>
                <span class="hidden md:inline">教師設定</span>
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-between p-4 max-w-5xl mx-auto w-full z-10 my-2">
        
        <!-- Large High-Contrast Date Display Card -->
        <div id="date-card" class="card-bg border-4 rounded-3xl p-6 sm:p-8 w-full text-center shadow-2xl relative overflow-hidden transition-transform duration-300">
            <div class="text-lg sm:text-xl font-black mb-2 opacity-90 tracking-widest uppercase">
                <i class="fa-regular fa-calendar-check mr-2"></i>今日日期
            </div>
            
            <!-- Date Breakdowns for Visually Impaired Readability -->
            <div class="flex flex-wrap items-center justify-center gap-3 sm:gap-6 my-2">
                <span id="display-year" class="text-4xl sm:text-5xl md:text-6xl font-black">2026年</span>
                <span id="display-month-day" class="text-4xl sm:text-5xl md:text-6xl font-black">9月30日</span>
                <span id="display-weekday" class="text-5xl sm:text-6xl md:text-7xl font-black">星期三</span>
            </div>
        </div>

        <!-- Giant Red Interactive Switch Center -->
        <div class="relative my-6 sm:my-8 flex flex-col items-center justify-center w-full">
            <!-- Ripple Effect Container Anchor -->
            <div id="ripple-container" class="absolute inset-0 flex items-center justify-center pointer-events-none"></div>

            <!-- Massive Switch Button -->
            <button id="big-switch" onclick="handleSwitchTrigger('touch')" class="big-switch-btn pulse-glow relative w-64 h-64 sm:w-80 sm:h-80 md:w-96 md:h-96 rounded-full bg-gradient-to-b from-red-500 via-red-600 to-red-800 border-8 border-red-200 flex flex-col items-center justify-center cursor-pointer select-none focus:outline-none focus:ring-8 focus:ring-yellow-300">
                <div class="w-48 h-48 sm:w-60 sm:h-60 md:w-72 md:h-72 rounded-full bg-gradient-to-b from-red-400 to-red-600 border-4 border-red-100/60 flex flex-col items-center justify-center text-white shadow-inner">
                    <i class="fa-solid fa-hand-pointer text-5xl sm:text-6xl md:text-7xl mb-2 filter drop-shadow-md"></i>
                    <span class="text-3xl sm:text-4xl md:text-5xl font-black tracking-widest drop-shadow-md">拍一下</span>
                    <span id="trigger-key-hint" class="text-xs sm:text-sm font-bold opacity-90 mt-2 bg-black/40 px-3 py-1 rounded-full border border-white/20">
                        按下任意鍵 / 空白鍵
                    </span>
                </div>
            </button>
        </div>

        <!-- Subtitle / Speech Feedback Display -->
        <div id="feedback-box" class="card-bg border-4 rounded-2xl p-4 sm:p-5 w-full text-center text-xl sm:text-2xl md:text-3xl font-black min-h-[80px] flex items-center justify-center transition-all">
            請拍一下大按鈕，聽聽今日是幾多號！
        </div>

    </main>

    <div id="teacher-panel" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 text-white border-4 border-amber-400 rounded-3xl max-w-2xl w-full p-6 sm:p-8 max-h-[90vh] overflow-y-auto shadow-2xl relative">
            
            <!-- Panel Header -->
            <div class="flex justify-between items-center border-b-2 border-slate-700 pb-4 mb-6">
                <h2 class="text-2xl sm:text-3xl font-black text-amber-400 flex items-center">
                    <i class="fa-solid fa-sliders mr-3"></i>教師及輔具設定選單
                </h2>
                <button onclick="toggleTeacherPanel()" class="text-slate-400 hover:text-white text-3xl font-bold focus:outline-none">
                    &times;
                </button>
            </div>

            <div class="space-y-6 text-base sm:text-lg">
                
                <!-- Customize Target Date Speech Text -->
                <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                    <label class="font-bold text-amber-300 block mb-2">
                        <i class="fa-solid fa-bullhorn mr-2"></i>設定目標報讀文字 (Target Speech Text)
                    </label>
                    <input type="text" id="target-speech-input" value="今天是2026年9月30日 星期三" class="w-full bg-slate-900 border-2 border-slate-600 rounded-xl p-3 font-bold text-amber-300 focus:outline-none focus:border-amber-400 text-lg">
                    <p class="text-xs text-slate-400 mt-2">提示：廣東話語音會直接朗讀此處輸入的完整句子。</p>
                </div>

                <!-- High Contrast Visual Theme Selector -->
                <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                    <label class="font-bold text-amber-300 block mb-2">
                        <i class="fa-solid fa-eye mr-2"></i>視覺高對比主題 (High Contrast Theme)
                    </label>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="setTheme('theme-yellow-on-black')" class="p-3 rounded-xl border-2 border-yellow-400 bg-black text-yellow-300 font-bold">高對比：黑底黃字</button>
                        <button onclick="setTheme('theme-black-on-yellow')" class="p-3 rounded-xl border-2 border-black bg-yellow-400 text-black font-bold">高對比：黃底黑字</button>
                        <button onclick="setTheme('theme-yellow-on-blue')" class="p-3 rounded-xl border-2 border-yellow-300 bg-blue-950 text-yellow-300 font-bold">高對比：深藍底黃字</button>
                        <button onclick="setTheme('theme-playful')" class="p-3 rounded-xl border-2 border-sky-400 bg-slate-900 text-white font-bold">預設繽紛黑藍</button>
                    </div>
                </div>

                <!-- Speech Rate Adjuster -->
                <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                    <label class="font-bold text-amber-300 block mb-2">
                        <i class="fa-solid fa-gauge-high mr-2"></i>廣東話朗讀速度 (Speech Rate)
                    </label>
                    <div class="grid grid-cols-3 gap-3">
                        <button onclick="setSpeechRate(0.7, this)" class="rate-btn bg-amber-500 text-slate-950 p-3 rounded-xl font-bold">慢速 (推薦 SEN)</button>
                        <button onclick="setSpeechRate(0.9, this)" class="rate-btn bg-slate-700 p-3 rounded-xl font-bold">中速 (正常)</button>
                        <button onclick="setSpeechRate(1.1, this)" class="rate-btn bg-slate-700 p-3 rounded-xl font-bold">快速</button>
                    </div>
                </div>

                <!-- Switch Lock / Debounce Timer (Spasticity Control) -->
                <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                    <label class="font-bold text-amber-300 block mb-2">
                        <i class="fa-solid fa-clock-rotate-left mr-2"></i>防誤觸／拍掣冷卻時間 (Debounce Lock)
                    </label>
                    <select id="debounce-select" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-3 font-bold text-white focus:outline-none focus:ring-2 focus:ring-amber-400">
                        <option value="500">0.5 秒 (快速回應)</option>
                        <option value="1500" selected>1.5 秒 (推薦：防止連拍誤觸)</option>
                        <option value="2500">2.5 秒 (適合嚴重肢體抽搐防誤觸)</option>
                    </select>
                </div>

                <!-- Key Trigger Configuration -->
                <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                    <label class="font-bold text-amber-300 block mb-2">
                        <i class="fa-solid fa-keyboard mr-2"></i>拍掣對應鍵盤按鍵 (Switch Trigger Key)
                    </label>
                    <select id="key-trigger-select" onchange="updateKeyHintText()" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-3 font-bold text-white focus:outline-none focus:ring-2 focus:ring-amber-400">
                        <option value="any">按鍵盤任何鍵 (Any Key) - 推薦連接 Interface</option>
                        <option value="Space">只按 空白鍵 (Spacebar)</option>
                        <option value="Enter">只按 Enter 鍵</option>
                    </select>
                </div>

                <!-- Sound Test & Praise Toggle -->
                <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 flex flex-col sm:flex-row justify-between items-center gap-4">
                    <div class="flex items-center space-x-3">
                        <input type="checkbox" id="enable-praise-check" checked class="w-6 h-6 accent-amber-400 rounded">
                        <label for="enable-praise-check" class="font-bold text-white">開啟獎勵鼓勵語句 ("真棒！拍得好呀！")</label>
                    </div>
                    <button onclick="testSpeech()" class="bg-sky-600 hover:bg-sky-500 text-white px-4 py-2 rounded-xl font-bold text-sm flex items-center">
                        <i class="fa-solid fa-volume-high mr-2"></i>測試廣東話語音
                    </button>
                </div>

                <!-- Stats and Counter Reset -->
                <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 flex justify-between items-center">
                    <div>
                        <span class="block text-sm text-slate-400">學生累積拍掣次數</span>
                        <span id="click-counter-display" class="text-3xl font-black text-amber-400">0 次</span>
                    </div>
                    <button onclick="resetStats()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl font-bold text-sm">
                        重置數據
                    </button>
                </div>

            </div>

            <!-- Modal Close Button -->
            <div class="mt-8">
                <button onclick="toggleTeacherPanel()" class="w-full bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xl py-3 rounded-2xl shadow-lg transition">
                    完成設定並返回教學
                </button>
            </div>

        </div>
    </div>

    <script>
        // System Global State Variables
        let clickCount = 0;
        let speechRate = 0.7; // Slow Cantonese speech rate tailored for SEN learning
        let isLocked = false; // Debounce lock state
        let synth = window.speechSynthesis;
        let audioCtx = null;

        // Encouraging Cantonese Praise Sentences
        const praisePhrases = [
            "真棒！拍得好厲害呀！",
            "你好聰明！做得好！",
            "太棒了！拍得真準確！",
            "好厲害！再拍一次吧！"
        ];

        // Initialization Logic
        window.addEventListener('DOMContentLoaded', () => {
            parseDateFromInput();
            setupKeyboardEvents();
            
            // Listen for input changes in teacher panel to update card in real-time
            document.getElementById('target-speech-input').addEventListener('input', parseDateFromInput);
        });

        // Parse Text Input to automatically update Date Cards
        function parseDateFromInput() {
            const text = document.getElementById('target-speech-input').value;
            
            // Regex to extract Year, Month, Day, Weekday
            const yearMatch = text.match(/(\d{4}年)/);
            const monthDayMatch = text.match(/(\d{1,2}月\d{1,2}日)/);
            const weekMatch = text.match(/(星期[一|二|三|四|五|六|日|天])/);

            if (yearMatch) document.getElementById('display-year').innerText = yearMatch[0];
            if (monthDayMatch) document.getElementById('display-month-day').innerText = monthDayMatch[0];
            if (weekMatch) document.getElementById('display-weekday').innerText = weekMatch[0];
        }

        // Web Audio API Sound Generator for instant cause-and-effect audio feedback
        function playChimeSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;
                
                // Primary Tone
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(523.25, now); // C5
                osc1.frequency.exponentialRampToValueAtTime(659.25, now + 0.15); // E5

                gain1.gain.setValueAtTime(0.4, now);
                gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.25);

                // Harmonic Harmony Tone
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(783.99, now + 0.05); // G5
                gain2.gain.setValueAtTime(0.3, now + 0.05);
                gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.05);
                osc2.stop(now + 0.3);

            } catch (e) {
                console.log('Audio Context Error', e);
            }
        }

        // Handle Switch Trigger (Keypress, Touch, or Click)
        function handleSwitchTrigger(source) {
            if (isLocked) return; // Debounce lock active

            const debounceTime = parseInt(document.getElementById('debounce-select').value, 10);
            isLocked = true;

            // Visual Button Down Animation
            const switchBtn = document.getElementById('big-switch');
            switchBtn.classList.add('active');
            setTimeout(() => switchBtn.classList.remove('active'), 180);

            // Immediate Sensory Feedback: Play Chime & Create Wave Effect
            playChimeSound();
            createRipple();
            createConfetti();

            // Update Counter State
            clickCount++;
            document.getElementById('star-count').innerText = clickCount;
            document.getElementById('click-counter-display').innerText = `${clickCount} 次`;

            // Speak Date in Cantonese TTS
            speakCantoneseDate();

            // Debounce Lock Release
            setTimeout(() => {
                isLocked = false;
            }, debounceTime);
        }

        // Cantonese Speech Synthesis Engine
        function speakCantoneseDate() {
            if (!synth) {
                alert('您的瀏覽器不支援語音合成功能，請使用 Chrome 或 Safari 瀏覽器。');
                return;
            }

            // Cancel any pending speech
            synth.cancel();

            const baseSpeechText = document.getElementById('target-speech-input').value;
            const enablePraise = document.getElementById('enable-praise-check').checked;
            
            let finalSpeechText = baseSpeechText;
            if (enablePraise) {
                const randomPraise = praisePhrases[Math.floor(Math.random() * praisePhrases.length)];
                finalSpeechText += `。${randomPraise}`;
            }

            // Update Feedback Subtitle Display
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.innerText = finalSpeechText;

            const utterance = new SpeechSynthesisUtterance(finalSpeechText);
            
            // Cantonese Speech Configuration
            utterance.lang = 'zh-HK';
            utterance.rate = speechRate;
            utterance.pitch = 1.1; // Friendly pitch

            // Select Best Cantonese Voice Profile
            const voices = synth.getVoices();
            const cantoneseVoice = voices.find(v => 
                v.lang.includes('HK') || 
                v.lang.includes('zh-HK') || 
                v.name.includes('Hong Kong') || 
                v.name.includes('Cantonese') || 
                v.name.includes('Sin-Ji')
            );

            if (cantoneseVoice) {
                utterance.voice = cantoneseVoice;
            }

            // Visual Highlighting during speech
            const dateCard = document.getElementById('date-card');
            utterance.onstart = () => {
                dateCard.classList.add('scale-105', 'ring-8', 'ring-amber-300');
            };

            utterance.onend = () => {
                dateCard.classList.remove('scale-105', 'ring-8', 'ring-amber-300');
            };

            synth.speak(utterance);
        }

        // Ensure voices are asynchronously loaded
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => synth.getVoices();
        }

        // Keyboard & Hardware Switch Listener
        function setupKeyboardEvents() {
            window.addEventListener('keydown', (e) => {
                // Ignore keypresses if Teacher Panel modal is open or when typing in inputs
                const modal = document.getElementById('teacher-panel');
                if (!modal.classList.contains('hidden') || e.target.tagName === 'INPUT') return;

                const triggerMode = document.getElementById('key-trigger-select').value;

                if (triggerMode === 'any') {
                    if (e.code !== 'F5' && e.code !== 'F12') { // Exclude refresh and developer tools
                        e.preventDefault();
                        handleSwitchTrigger('keyboard');
                    }
                } else if (triggerMode === 'Space' && (e.code === 'Space' || e.key === ' ')) {
                    e.preventDefault();
                    handleSwitchTrigger('keyboard');
                } else if (triggerMode === 'Enter' && e.code === 'Enter') {
                    e.preventDefault();
                    handleSwitchTrigger('keyboard');
                }
            });
        }

        // Visual Water Wave / Ripple Effect Generator
        function createRipple() {
            const container = document.getElementById('ripple-container');
            const ripple = document.createElement('div');
            ripple.className = 'ripple-ring';
            container.appendChild(ripple);
            setTimeout(() => ripple.remove(), 750);
        }

        // Confetti Fireworks Generator
        function createConfetti() {
            const colors = ['#FFDE00', '#FF2A00', '#00E5FF', '#00FF66', '#FF00CC', '#9900FF'];
            for (let i = 0; i < 22; i++) {
                const p = document.createElement('div');
                p.className = 'confetti-particle';
                p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                p.style.left = `${Math.random() * 80 + 10}%`;
                p.style.top = '35%';
                p.style.animationDelay = `${Math.random() * 0.15}s`;
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 2200);
            }
        }

        // Teacher Panel Control Functions
        function toggleTeacherPanel() {
            const modal = document.getElementById('teacher-panel');
            modal.classList.toggle('hidden');
        }

        function setSpeechRate(rate, btnElement) {
            speechRate = rate;
            document.querySelectorAll('.rate-btn').forEach(b => {
                b.classList.remove('bg-amber-500', 'text-slate-950');
                b.classList.add('bg-slate-700', 'text-white');
            });
            if (btnElement) {
                btnElement.classList.remove('bg-slate-700', 'text-white');
                btnElement.classList.add('bg-amber-500', 'text-slate-950');
            }
        }

        function setTheme(themeClass) {
            document.body.className = `min-h-screen flex flex-col justify-between overflow-x-hidden relative transition-colors duration-300 ${themeClass}`;
        }

        function updateKeyHintText() {
            const mode = document.getElementById('key-trigger-select').value;
            const hint = document.getElementById('trigger-key-hint');
            if (mode === 'any') hint.innerText = '按下任意鍵 / 空白鍵';
            else if (mode === 'Space') hint.innerText = '按下 空白鍵 (Space)';
            else if (mode === 'Enter') hint.innerText = '按下 Enter 鍵';
        }

        function testSpeech() {
            speakCantoneseDate();
        }

        function resetStats() {
            clickCount = 0;
            document.getElementById('star-count').innerText = '0';
